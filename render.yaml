databases:
  - name: postgres
    databaseName: tchopmygrinds
    user: tchopmygrinds
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: tchopmygrinds
    runtime: ruby
    env: ruby
    plan: free
    region: oregon
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server -b 0.0.0.0 -p ${PORT:-10000}"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: LANG
        value: C.UTF-8
      - key: LC_ALL
        value: C.UTF-8
