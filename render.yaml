databases:
  - name: postgres
    databaseName: tchopmygrinds
    user: tchopmygrinds
    ipAllowList: []
    plan: free

services:
  - type: web
    name: tchopmygrinds
    runtime: ruby
    env: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server -b 0.0.0.0 -p ${PORT:-10000}"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: LANG
        value: C.UTF-8
      - key: LC_ALL
        value: C.UTF-8
