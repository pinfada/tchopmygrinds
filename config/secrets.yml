# Be sure to restart your server when you modify this file.
#
# Secrets are read exclusively from environment variables.
# - In production, SECRET_KEY_BASE MUST be set; the app refuses to boot otherwise.
# - In development/test, a static placeholder is used only when the env var is
#   absent. This placeholder is NOT a secret and is safe to commit. Rotate by
#   setting SECRET_KEY_BASE in your local .env file.
#
# To generate a real key locally: `bin/rails secret`.

development:
  email_provider_username: <%= ENV["SENDGRID_USERNAME"] %>
  email_provider_password: <%= ENV["SENDGRID_PASSWORD"] %>
  domain_name: <%= ENV.fetch("DOMAIN_NAME", "example.com") %>
  mailchimp_api_key: <%= ENV["MAILCHIMP_API_KEY"] %>
  mailchimp_list_id: <%= ENV["MAILCHIMP_LIST_ID"] %>
  owner_email: <%= ENV["OWNER_EMAIL"] %>
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE", "development-placeholder-not-secret-set-SECRET_KEY_BASE-env-var-please") %>

test:
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE", "test-placeholder-not-secret-set-SECRET_KEY_BASE-env-var-for-real-runs") %>

# Production secrets MUST come from the environment.
# We intentionally use ENV["..."] (not fetch) so YAML parsing succeeds in dev/test
# even when SECRET_KEY_BASE is absent. Rails itself raises at boot in production
# if secret_key_base is missing, so the safety net is preserved where it matters.
production:
  email_provider_username: <%= ENV["SENDGRID_USERNAME"] %>
  email_provider_password: <%= ENV["SENDGRID_PASSWORD"] %>
  domain_name: <%= ENV["DOMAIN_NAME"] %>
  mailchimp_api_key: <%= ENV["MAILCHIMP_API_KEY"] %>
  mailchimp_list_id: <%= ENV["MAILCHIMP_LIST_ID"] %>
  owner_email: <%= ENV["OWNER_EMAIL"] %>
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
